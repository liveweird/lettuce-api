          type: string
          format: date
          description: ISO `YYYY-MM-DD`; the first day the entry relates to. Past dates are fine.
        periodEnd:
          type: string
          format: date
          description: ISO `YYYY-MM-DD`; not earlier than `periodStart`.
        whatHappened:
          type: string
          maxLength: 5000
          description: Markdown; required non-blank.
        contribution:
          type: string
          maxLength: 5000
          description: Markdown; required non-blank.
        whyItMattered:
          type: string
          maxLength: 5000
          description: Markdown; required non-blank.
        evidence:
          type: string
          maxLength: 5000
          description: 'Markdown; required non-blank: the evidence / feedback supporting the entry.'

    ImpactEntryResponse:
      type: object
      required: [id, userId, userName, title, periodStart, periodEnd, whatHappened, contribution, whyItMattered, evidence, createdAt, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        userId:
          type: integer
          format: int32
          minimum: 0
          description: The journal's owner — always the creator; never changes.
        userName: { type: string }
        title:
          type: string
