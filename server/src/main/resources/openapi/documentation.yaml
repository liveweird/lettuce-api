    TeamKpiEventResponse:
      type: object
      required: [id, kpiId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kpiId: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - TITLE_CHANGED
            - DESCRIPTION_CHANGED
            - TYPE_CHANGED
            - TARGET_CHANGED
            - TARGET_DIRECTION_CHANGED
            - VALUE_RECORDED
            - VALUE_CORRECTED
            - VALUE_REMOVED
            - STATUS_CHANGED
            - DELETED
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — enum names (`from`/`to`
            statuses and types, the CREATED event's `type`), numeric values (target `from`/`to`),
            and ISO dates. The data-point events carry `{date, value}` (`VALUE_RECORDED` /
            `VALUE_REMOVED`) or `{fromDate, fromValue, toDate, toValue}` (`VALUE_CORRECTED` —
            always all four, even when only one dimension changed). Never
            title/description/summary text (description and summary are encrypted at rest; this
            trail is plaintext by design). Empty object when the event kind needs none.

