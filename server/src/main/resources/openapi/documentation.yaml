      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/PublicHoliday'
          description: The month's public holidays, date-ascending.
        users:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffCalendarUser'
          description: Every user in the scope (entries or not), sorted by name.

    DaysOffBudget:
      type: object
      required:
        [userId, userName, userDeleted, year, poolId, poolTypeId, poolName, carriesOver, isDefault,
         poolArchived, allowance, carriedOver, corrected, reserved, used, remaining, canCorrect]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        userDeleted: { type: boolean }
        year: { type: integer }
        poolId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The ACTIVE grant row's id (v3.2.0) — the DELETE /days-off/pools/{id} handle; null
            = no active grant (the ungranted default pool, or a history-only archived pool).
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          description: The pool kind (v3.2.0).
        poolName:
          type: string
          description: The pool kind's current name (v3.2.0).
        carriesOver:
          type: boolean
          description: Whether unused days of this pool carry over year to year (v3.2.0).
        isDefault:
          type: boolean
          description: Whether this is the default pool — always present per user, never archivable (v3.2.0).
        poolArchived:
          type: boolean
          description: >-
            A non-default pool with counting requests or corrections in this year but no
            active grant — or an active grant whose KIND was archived under it (v3.2.1) —
            history renders, no new requests may target it. Its `allowance` is null, so
            `remaining` shows the (typically negative) residual of the year's usage.
        allowance:
          type: integer
          nullable: true
          description: >-
            The configured annual allowance in whole days (set by a chain manager via
            PUT /days-off/allowance since v2.32.0); null = no active grant = zero budget.
        carriedOver:
          type: number
          format: double
          description: Days carried in from previous years (0 with no earlier usage, and always 0 for a non-carry-over pool kind).
        corrected:
          type: number
          format: double
          description: The year's net manager corrections in days (signed; 0 when none).
        reserved:
          type: number
          format: double
          description: The year's REQUESTED (pending) paid days — reserved, not yet confirmed.
        used:
          type: number
          format: double
          description: The year's ACCEPTED paid days.
        remaining:
          type: number
          format: double
          description: >-
            carriedOver + allowance + corrected − reserved − used; may be negative after a
            retroactive allowance cut.
        canCorrect:
          type: boolean
          description: >-
            Server-computed capability (v2.32.0): the caller may write budget corrections for
            this user — chain-wide since v2.33.0, so true on every managed-view row
            (includeIndirect ones included, matching the allowance right); always false on
            view=own.

    DaysOffBudgetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffBudget'

    DaysOffAllowanceWrite:
      type: object
      required: [userId, allowance]
      properties:
        userId:
          type: integer
          format: int32
          minimum: 0
          description: The user whose allowance is set — must be in the caller's transitive
            management subtree (403 otherwise, uniformly).
        allowance:
          type: integer
          minimum: 0
          maximum: 365
          description: The annual paid days-off allowance in whole days. Applies to every
            calendar year (a change recomputes carry-over retroactively).
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The paid pool kind the allowance belongs to (v3.2.0); omitted/null = the default
            kind. An unknown or archived kind is 400.

    DaysOffPoolType:
      type: object
      required: [id, name, carriesOver, isDefault]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string, maxLength: 100 }
        carriesOver:
          type: boolean
          description: Unused days transfer to the next year (the closed-form carry-over); false = the pool resets every January.
        isDefault:
          type: boolean
          description: The one seeded default kind — every pre-v3.2.0 paid request maps to it; renameable, never archivable.

    DaysOffPoolTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffPoolType'

    DaysOffPoolTypeWrite:
      type: object
      required: [name, carriesOver]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Canonicalized single line (trimmed, no control characters); unique among active kinds (409).
        carriesOver: { type: boolean }

    DaysOffCorrectionWrite:
