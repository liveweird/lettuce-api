    TeamKpiCreateRequest:
      type: object
      required: [teamId, title, type, targetValue]
      properties:
        teamId:
          type: integer
          format: int32
          minimum: 0
          description: Must be a non-deleted team whose current manager the caller is.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Plaintext (unlike description/summary) — lists sort and filter on it.
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
          description: How the KPI is measured. There is no PLAN flavor.
        targetValue:
          type: number
          format: double
          description: Always required — finite; 0–100 for PERCENTAGE.
        targetDirection:
          type: string
          enum: [AT_LEAST, AT_MOST]
          default: AT_LEAST
          description: >-
            Which side of the target is good — AT_LEAST (reach the target or more) or AT_MOST
            (stay at the target or below); meeting it exactly always counts as good.

    TeamKpiDefinitionUpdate:
      type: object
      required: [title, type, targetValue]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
          description: >-
            Changing the type wipes all collected data points (a NUMBER series is meaningless
            against a PERCENTAGE target and vice versa).
        targetValue:
          type: number
          format: double
          description: Always required — finite; 0–100 for PERCENTAGE.
        targetDirection:
          type: string
          enum: [AT_LEAST, AT_MOST]
          default: AT_LEAST
          description: >-
            Which side of the target is good — AT_LEAST (reach the target or more) or AT_MOST
            (stay at the target or below); meeting it exactly always counts as good.

