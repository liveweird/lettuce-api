    SuccessionPlanCreateRequest:
      type: object
      required: [userId, roleCriticality, retentionRisk]
      properties:
        userId:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The seat's person — must be in the caller's transitive management chain at
            creation (else 403) and active (else 400). Immutable after creation.
        roleCriticality:
          type: string
          enum: [CRITICAL, CORE, STANDARD]
          description: How critical the seat is to the organization — a planning label.
        retentionRisk:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: How likely the seat's person is to leave — a planning label.
        lossImpact:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
          default: []
          description: >-
            Ordered short texts describing what is lost if the seat empties (each non-blank,
            at most 200 characters; order is meaningful and preserved). Encrypted at rest.
        targetBenchDepth:
          type: integer
          minimum: 1
          maximum: 10
          default: 2
          description: >-
            The minimum nominated successors this seat needs; the bench cue compares
            benchCount against it.

    SuccessionPlanUpdate:
      type: object
      required: [roleCriticality, retentionRisk]
      properties:
        roleCriticality:
          type: string
          enum: [CRITICAL, CORE, STANDARD]
        retentionRisk:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        lossImpact:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
          default: []
          description: Ordered short texts; the whole list is replaced on every save.
        targetBenchDepth:
          type: integer
          minimum: 1
          maximum: 10
          default: 2

    SuccessionPlanEventResponse:
      type: object
      required: [id, planId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        planId: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds of the change. Server-managed.
        type:
          type: string
          enum: [CREATED, CRITICALITY_CHANGED, RISK_CHANGED, BENCH_DEPTH_CHANGED, LOSS_IMPACT_CHANGED, REVIEW_COMPLETED, CLOSED, DELETED, NOMINATION_ADDED, NOMINATION_UPDATED, NOMINATION_REMOVED, PRIMARY_DEMOTED]
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — enum names, numbers, and
            candidate display names only (never loss-impact/competency-gap text). In use:
            `roleCriticality`/`retentionRisk`/`targetBenchDepth` (CREATED), `from`/`to`
            (the *_CHANGED kinds except LOSS_IMPACT_CHANGED, which carries none), `candidateName` + `readiness`/`nominationType`/`awareness`
            (NOMINATION_ADDED), `candidateName` + `changed` (comma-joined field names:
            candidate, readiness, nominationType, awareness, competencyGaps, goals) +
            optional `readinessFrom/To`/`nominationTypeFrom/To`/`awarenessFrom/To`
            (NOMINATION_UPDATED), `candidateName` (NOMINATION_REMOVED, PRIMARY_DEMOTED).
            Empty object when the event kind needs none.

    SuccessionPlanEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuccessionPlanEventResponse' }

    SuccessionCompetencyGap:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: Non-blank short text naming the gap. Encrypted at rest.
        filled:
          type: boolean
          default: false
          description: >-
            The progress flag (v2.45.0): the owner ticks it when the gap has been filled;
            filled gaps render struck through on the plan's nomination cards. Rows stored
            before the flag existed decode as not filled.

    SuccessionGoalRef:
      type: object
      required: [id, title, status, type]
      description: >-
        A light reference to a linked development goal — the plaintext identity fields the
        client renders as a chip. The goal document itself stays behind the ordinary goal
        read rules.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        title: { type: string }
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        type:
          type: string
          enum: [PLAN, NUMBER, PERCENTAGE]

    SuccessionNominationRequest:
      type: object
      required: [candidateId, readiness, nominationType, awareness]
      properties:
        candidateId:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The nominated employee — any active user except the seat's own person (no chain
            requirement; cross-team/lateral candidates are expected).
        readiness:
          type: string
          enum: [READY_NOW, READY_SOON, FUTURE_PIPELINE, EMERGENCY_INTERIM]
          description: >-
            The candidate's readiness window — ready now (0-3 mo), ready soon (3-12 mo),
            future pipeline (1-2 yrs), or emergency interim only.
        nominationType:
          type: string
          enum: [PRIMARY, SECONDARY, CROSS_TEAM]
          description: >-
            At most one active PRIMARY nomination per plan — a write that sets PRIMARY
            demotes any existing PRIMARY nomination on the plan to SECONDARY in the same
            transaction (clients should confirm with the user first).
        competencyGaps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SuccessionCompetencyGap' }
          default: []
          description: >-
            Ordered gaps naming what the candidate still lacks for the seat, each with its
            filled progress flag (wholesale-replaced on every save). Encrypted at rest.
        awareness:
          type: string
          enum: [TRANSPARENT, IMPLICIT, CONFIDENTIAL]
          description: >-
            Whether the candidate knows about the nomination — metadata only: whatever the
            value, the candidate is never notified and never granted any read.
        goalIds:
          type: array
          maxItems: 100
          items: { type: integer, format: int32, minimum: 0 }
          default: []
          description: >-
            The linked development action items (existing personal goals of the candidate),
            wholesale-replaced on every save, payload order preserved. Each must be readable
            by the plan's owner under the goal rules; duplicates are 400.

