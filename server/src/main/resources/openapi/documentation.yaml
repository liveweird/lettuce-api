      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
          description: >-
            The ISO YYYY-MM-DD date the value was measured — required, strict zero-padded, and
            never in the future (today is allowed, plus one day of timezone tolerance). At most one value per date per KPI.
        value:
          type: number
          format: double
          description: The measured value — always required (finite; 0–100 for PERCENTAGE).

    TeamKpiValueResponse:
      type: object
      required: [id, date, value]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        date:
          type: string
          format: date
          description: ISO YYYY-MM-DD measurement date — unique within the KPI.
        value: { type: number, format: double }

    TeamKpiValueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamKpiValueResponse' }
          description: The KPI's data points, sorted by date newest first.

    TeamKpiArchiveRequest:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
          description: The archiving summary — required and non-blank; recorded on the KPI.

    TeamKpiResponse:
      type: object
      required: [id, teamId, teamName, teamDeleted, managerId, managerName, creatorId, creatorName, creatorDeleted, canManage, canRecordValues, createdAt, title, description, type, targetValue, targetDirection, currentValue, currentValueDate, status, summary, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        teamDeleted:
          type: boolean
          description: >-
            True when the team has been soft-deleted — the KPI stays readable history for the
            team's last manager.
        managerId:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The team's CURRENT manager (`teams.manager_id`), resolved at read time — never
            stored on the KPI, so a reassigned team's new manager takes over.
        managerName: { type: string }
        creatorId:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Who created the KPI (v2.26.0) — informational only; every right tracks the team's
            current manager + their chain, never the creator.
        creatorName: { type: string }
        creatorDeleted:
          type: boolean
          description: True when the creator's account has been soft-deleted.
        canManage:
          type: boolean
          description: >-
            Server-computed capability of the CALLER (v2.26.0): may edit the definition,
            delete the draft, and drive the lifecycle — true for the team's current manager
            and the managers in the chain above them.
        canRecordValues:
          type: boolean
          description: >-
            Server-computed capability of the CALLER (v2.26.0): may add/correct/remove data
            points (exercised while ACTIVE) — `canManage` or a current team member.
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, immutable.
        title: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double }
        targetDirection:
          type: string
          enum: [AT_LEAST, AT_MOST]
          description: >-
            Which side of the target is good (v2.41.0) — AT_LEAST on every pre-existing KPI.
        currentValue:
          type: number
          format: double
          description: >-
            Denormalized from the data points: the max-dated point's value, recomputed on
            every values mutation — 0.0 when there are none.
        currentValueDate:
          type: string
          format: date
          nullable: true
          description: >-
            ISO YYYY-MM-DD date of the max-dated data point — null when the KPI has no data
            points (never recorded, or wiped by a type-change reset).
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        summary:
          type: string
          nullable: true
          description: >-
            Non-null once the KPI has been archived at least once — kept on reopen,
            overwritten at the next archive.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every mutation.

    TeamKpiListItem:
      type: object
      required: [id, teamId, teamName, teamDeleted, managerId, managerName, managerDeleted, creatorId, creatorName, creatorDeleted, canManage, title, type, targetValue, targetDirection, currentValue, status, createdAt, lastModified]
      properties:
