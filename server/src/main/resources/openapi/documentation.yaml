        planId: { type: integer, format: int32, minimum: 0 }
        candidateId: { type: integer, format: int32, minimum: 0 }
        candidateName: { type: string }
        readiness:
          type: string
          enum: [READY_NOW, READY_SOON, FUTURE_PIPELINE, EMERGENCY_INTERIM]
        nominationType:
          type: string
          enum: [PRIMARY, SECONDARY, CROSS_TEAM]
        competencyGaps:
          type: array
          items: { $ref: '#/components/schemas/SuccessionCompetencyGap' }
        awareness:
          type: string
          enum: [TRANSPARENT, IMPLICIT, CONFIDENTIAL]
        goals:
          type: array
          items: { $ref: '#/components/schemas/SuccessionGoalRef' }
          description: Linked development goals in stored order; soft-deleted goals drop out.
        createdAt: { type: integer, format: int64 }
        lastModified: { type: integer, format: int64 }

    SuccessionPlanResponse:
      type: object
      required: [id, managerId, managerName, userId, userName, roleCriticality, retentionRisk, lossImpact, targetBenchDepth, status, benchCount, nominations, createdAt, lastReviewedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
