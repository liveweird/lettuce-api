        whatHappened: { type: string }
        contribution: { type: string }
        whyItMattered: { type: string }
        evidence: { type: string }
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, immutable.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every mutation.

    ImpactEntryListItem:
      type: object
      required: [id, userId, userName, userDeleted, title, periodStart, periodEnd, createdAt, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        userDeleted: { type: boolean }
        title:
          type: string
