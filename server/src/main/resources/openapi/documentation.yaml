          minLength: 1
          maxLength: 1000
          description: The mandatory reasoning — non-blank; stored encrypted at rest.
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The adjusted paid pool kind (v3.2.0); omitted/null = the default kind on create.
            Immutable on PUT: omitted/null = unchanged, a differing kind = 400. An extra kind
            needs an active grant of the subordinate (400 otherwise).

    DaysOffCorrection:
      type: object
