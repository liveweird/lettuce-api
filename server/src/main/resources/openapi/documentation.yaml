          format: int32
          minimum: 0
          description: Who created the KPI (v2.26.0) — informational only, see TeamKpiResponse.
        creatorName: { type: string }
        creatorDeleted: { type: boolean }
        canManage:
          type: boolean
          description: The CALLER's definition/lifecycle capability — see TeamKpiResponse.
        title: { type: string }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double }
        targetDirection:
          type: string
          enum: [AT_LEAST, AT_MOST]
        currentValue: { type: number, format: double }
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        createdAt: { type: integer, format: int64 }
        lastModified: { type: integer, format: int64 }

    TeamKpiPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamKpiListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
