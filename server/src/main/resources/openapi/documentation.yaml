        userId: { type: integer, format: int32, minimum: 0 }
        authorId:
          type: integer
          format: int32
          minimum: 0
          description: Who created the correction — display-only; edit rights follow the current management chain.
        authorName: { type: string }
        authorDeleted: { type: boolean }
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          description: The adjusted pool kind (v3.2.0).
        poolName:
          type: string
          description: The adjusted pool kind's current name (v3.2.0).
        year: { type: integer }
        operation: { type: string, enum: [ADD, SUBTRACT] }
        days: { type: number, format: double }
        comment: { type: string }
        createdAt: { type: integer, format: int64 }
        lastModified: { type: integer, format: int64 }

    DaysOffCorrectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffCorrection'

    PublicHoliday:
      type: object
      required: [id, date, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        date: { type: string, format: date }
        name: { type: string, maxLength: 100 }

    PublicHolidayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicHoliday'

    PublicHolidayCreateRequest:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
          description: Strict zero-padded ISO YYYY-MM-DD; at most one holiday per date (409).
        name: { type: string, maxLength: 100 }

    NotificationResponse:
      type: object
      required: [id, recipientId, timestamp, type, params, wasSeen]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        recipientId: { type: integer, format: int32, minimum: 0 }
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the notification was generated. Server-managed.
        type:
          type: string
          enum:
            - FEEDBACK_REQUESTED_TO_PROVIDER
            - FEEDBACK_REQUESTED_TO_REQUESTER
            - FEEDBACK_SENT_TO_SUBJECT
            - FEEDBACK_SENT_TO_PROVIDER
            - FEEDBACK_SENT_TO_REQUESTER
            - FEEDBACK_SENT_TO_MANAGER
            - FEEDBACK_REJECTED_TO_REQUESTER
            - FEEDBACK_PICKED_UP_TO_REQUESTER
            - FEEDBACK_WITHDRAWN_TO_SUBJECT
            - FEEDBACK_WITHDRAWN_TO_REQUESTER
            - FEEDBACK_DELETED_TO_REQUESTER
            - FEEDBACK_REQUEST_EXPIRED_TO_REQUESTER
            - FEEDBACK_REQUEST_EXPIRED_TO_PROVIDER
            - ONE_ON_ONE_CREATED_TO_SUBORDINATE
            - ONE_ON_ONE_CREATED_TO_MANAGER
            - GOAL_ACTIVATED_TO_SUBORDINATE
            - GOAL_DEACTIVATED_TO_SUBORDINATE
            - GOAL_ARCHIVED_TO_SUBORDINATE
            - GOAL_REOPENED_TO_SUBORDINATE
            - GOAL_PROGRESS_UPDATED_TO_SUBORDINATE
            - GOAL_PROGRESS_UPDATED_TO_MANAGER
            - TEAM_KPI_ACTIVATED_TO_MEMBER
            - TEAM_KPI_DEACTIVATED_TO_MEMBER
            - TEAM_KPI_ARCHIVED_TO_MEMBER
            - TEAM_KPI_VALUE_RECORDED_TO_MEMBER
            - TEAM_KPI_VALUE_CORRECTED_TO_MEMBER
            - TEAM_KPI_VALUE_REMOVED_TO_MEMBER
            - TEAM_KPI_REOPENED_TO_MEMBER
            - PERFORMANCE_REVIEW_PUBLISHED_TO_SUBORDINATE
            - PERFORMANCE_REVIEW_UNPUBLISHED_TO_SUBORDINATE
            - DAYS_OFF_REQUESTED_TO_MANAGER
            - DAYS_OFF_ACCEPTED_TO_OWNER
            - DAYS_OFF_REJECTED_TO_OWNER
            - DAYS_OFF_CANCELLED_TO_MANAGER
            - DAYS_OFF_CANCELLED_TO_OWNER
            - DAYS_OFF_CORRECTED_TO_OWNER
            - DAYS_OFF_RECORDED_TO_OWNER
            - DAYS_OFF_RECORDED_TO_MANAGER
            - DAYS_OFF_ALLOWANCE_CHANGED
            - PULSE_CYCLE_SCHEDULED
            - PULSE_CYCLE_OPENED
            - PULSE_RESULTS_AVAILABLE
            - PULSE_CYCLE_CANCELLED
            - IMPACT_ENTRY_CREATED_TO_MANAGER
            - IMPACT_ENTRY_UPDATED_TO_MANAGER
            - IMPACT_ENTRY_DELETED_TO_MANAGER
            - CAREER_POSITION_STARTED_TO_USER
            - PASSWORD_CHANGED
          description: Notification kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation values for the localized message — party names (proper nouns), e.g.
            `{provider,subject,requester}`; plus `self` — the SPA's i18next context carrier:
            `"self"` for the "about yourself" variants (on the feedback kinds only for LEGACY
            self-reflection rows — new provider == subject feedbacks are rejected since
            v2.36.0), `"reflection"` for a
            requester's own request-for-a-self-reflection confirmation (legacy rows only),
            and on PASSWORD_CHANGED
            `"admin"` (an administrator reset it) or `"reset"` (self-service email reset; absent
            = the user changed it themselves). ONE_ON_ONE_CREATED_TO_SUBORDINATE carries
            `{manager,date}` and ONE_ON_ONE_CREATED_TO_MANAGER `{subordinate,date}` (the
            counterpart's name and the ISO meeting date). The GOAL_* kinds carry
            `{manager,title}` — the manager's name and the goal's plaintext title. The
            TEAM_KPI_* kinds carry `{manager,title,team}` — the manager's name, the KPI's
            plaintext title, and the team's name. The PERFORMANCE_REVIEW_* kinds carry
            `{manager,startMonth,endMonth}` — the manager's name and the period's raw ISO
            month bounds (the client formats the period). The DAYS_OFF_* kinds carry the party
            name (`requester` toward managers, `manager` toward the owner) plus raw ISO
            `{startDate,endDate}`; DAYS_OFF_REQUESTED_TO_MANAGER additionally `{type,days}`
            (the enum name and a "1.5"-style days string) — the client formats all of them.
            The DAYS_OFF_RECORDED_* pair (an on-behalf recording, v2.29.0) also carries
            `{type,days}` next to its party name. DAYS_OFF_CORRECTED_TO_OWNER carries
            `{manager,year,operation,days}` — the client words ADD/SUBTRACT from `operation`.
            The IMPACT_ENTRY_* kinds carry `{author,periodStart,periodEnd}` — the journal
            owner's name and the entry's raw ISO period bounds (never section text).
        link:
          type: string
          nullable: true
          description: Optional in-app path to open from the notification; absent when there is nowhere to go.
        wasSeen:
          type: boolean
          description: Whether the recipient has marked the notification as seen.

    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DashboardSummary:
      type: object
      required: [pendingFeedbackRequests, activeGoals, feedbackReceived30d, directReports]
      properties:
        pendingFeedbackRequests:
          type: integer
          format: int64
          minimum: 0
          description: Active feedback requests (REQUESTED) waiting for the caller as provider.
        activeGoals:
          type: integer
          format: int64
          minimum: 0
          description: The caller's own ACTIVE goals.
        feedbackReceived30d:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Delivered (SENT) feedbacks in the caller's received scope whose SENT moment falls
            within the last 30 days (audit-trail event time; pre-events rows fall back to
            last-modification time).
        feedbackReceivedPrev30d:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            The same received count for the preceding 30-day window (days 60–30 ago) — the
            base of the tile's trend indicator. Optional for older-server tolerance.
        directReports:
          type: integer
          minimum: 0
          description: >-
            Distinct current direct reports of the caller (members of non-deleted teams they
            manage). 0 for non-managers — the client hides the manager tiles on it.
        currentPeriodId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            Id of the review period containing the current month; null while the timeline
            does not cover today (the reviews tile hides).
        currentPeriodReviewsDone:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Performance reviews the caller authored for the current period (any status);
            null exactly when currentPeriodId is null.
        pulseOpenCloseDate:
          type: string
          format: date
          nullable: true
          description: >-
            The OPEN pulse cycle's planned close date — null unless the caller is a
            participant of an open cycle (with PULSE_SURVEYS enabled). Backs the pulse tile.
        pulseSubmitted:
          type: boolean
          nullable: true
          description: >-
            Whether the caller already submitted in the open cycle; null exactly when
            pulseOpenCloseDate is null.

    PulseCycleStatus:
      type: string
      enum: [SCHEDULED, OPEN, CLOSED, CANCELLED]
      description: >-
        The cycle machine: SCHEDULED -> OPEN -> CLOSED, with terminal CANCELLED reachable
        from any of the three. Every transition is a manual ADMIN action.

    PulseCycle:
      type: object
      required: [id, status, plannedOpenDate, plannedCloseDate, createdAt, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        status: { $ref: '#/components/schemas/PulseCycleStatus' }
        plannedOpenDate:
          type: string
          format: date
          description: Advisory planned open date (ISO). The server never acts on it.
        plannedCloseDate:
          type: string
          format: date
          description: Advisory planned close date (ISO); admin-editable while OPEN ("extend").
        rotatingQuestion:
          type: object
          nullable: true
          required: [en]
          properties:
            en: { type: string }
          additionalProperties: { type: string }
          description: >-
            The cycle's snapshotted Q6 text as a language->value map ("en" always present —
            the DictionaryValues shape, frozen at schedule time). Null for non-admins until
            the cycle is OPEN or CLOSED (and always null to them for CANCELLED) —
            whole-map-or-null.
        createdAt: { type: integer, format: int64 }
        openedAt: { type: integer, format: int64, nullable: true }
        closedAt: { type: integer, format: int64, nullable: true }
        cancelledAt: { type: integer, format: int64, nullable: true }
        lastModified: { type: integer, format: int64 }
        participantCount:
          type: integer
          minimum: 0
          nullable: true
          description: ADMIN-only enrichment (null for everyone else).
        responseCount:
          type: integer
          minimum: 0
          nullable: true
          description: ADMIN-only enrichment (null for everyone else).

    PulseCycleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PulseCycle' }

    PulseCycleCreateRequest:
      type: object
      required: [plannedOpenDate, plannedCloseDate]
      properties:
        plannedOpenDate: { type: string, format: date }
        plannedCloseDate:
          type: string
          format: date
          description: Must be strictly after plannedOpenDate.

    PulseCycleUpdateRequest:
      type: object
      required: [plannedOpenDate, plannedCloseDate]
      properties:
        plannedOpenDate:
          type: string
          format: date
          description: While OPEN this must equal the stored open date (only the close date may change).
        plannedCloseDate: { type: string, format: date }

    PulseScaleAnswer:
      type: string
      enum: ["1", "2", "3", "4", "5", "NA"]
      description: >-
        The five-point agreement scale (1 = strongly disagree .. 5 = strongly agree) plus
        "NA" (not applicable — excluded from every driver calculation).

    PulseResponseSubmitRequest:
      type: object
      required: [enps, q2, q3, q4, q5, rotating]
      properties:
        enps:
          type: integer
          minimum: 0
          maximum: 10
          description: Q1, the eNPS answer (0 = not at all likely, 10 = extremely likely).
        q2: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q3: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q4: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q5: { $ref: '#/components/schemas/PulseScaleAnswer' }
        rotating: { $ref: '#/components/schemas/PulseScaleAnswer' }
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional written answer (blank = absent). Shown to managers anonymized.

    PulseMyResponse:
      type: object
      required: [cycleId, enps, q2, q3, q4, q5, rotating, submittedAt, lastModified]
      properties:
        cycleId: { type: integer, format: int32, minimum: 0 }
        enps: { type: integer, minimum: 0, maximum: 10 }
        q2: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q3: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q4: { $ref: '#/components/schemas/PulseScaleAnswer' }
        q5: { $ref: '#/components/schemas/PulseScaleAnswer' }
        rotating: { $ref: '#/components/schemas/PulseScaleAnswer' }
        comment: { type: string, nullable: true }
        submittedAt:
          type: integer
          format: int64
          description: Epoch millis of the FIRST submission (immutable across edits).
        lastModified: { type: integer, format: int64 }

    PulseParticipationCounts:
      type: object
      required: [participantCount, responseCount, responseRate]
      properties:
        participantCount: { type: integer, minimum: 0 }
        responseCount: { type: integer, minimum: 0 }
        responseRate:
          type: number
          format: double
          description: responses / participants as a 1dp percent (0.0 for an empty snapshot).

    PulseParticipationMember:
      type: object
      required: [userId, name, responded]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        responded: { type: boolean }

    PulseParticipationTeam:
      type: object
      required: [teamId, teamName, members]
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/PulseParticipationMember' }
          description: The team's current members who are cycle participants, name-ascending.

    PulseParticipationStatusResponse:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/PulseParticipationTeam' }

    PulseAggregationMode:
      type: string
      enum: [direct, subtree]

    PulseEnpsAggregate:
      type: object
      required: [score, promoterPct, passivePct, detractorPct]
      properties:
        score:
          type: integer
          minimum: -100
          maximum: 100
          description: promoter% - detractor%, rounded to a whole point.
        promoterPct: { type: number, format: double, description: 'Share of 9-10 answers, 1dp.' }
        passivePct: { type: number, format: double, description: 'Share of 7-8 answers, 1dp.' }
        detractorPct: { type: number, format: double, description: 'Share of 0-6 answers, 1dp.' }

    PulseDriverQuestion:
      type: string
      enum: [Q2, Q3, Q4, Q5, ROTATING]

    PulseDriverResult:
      type: object
      required: [question, validCount]
      properties:
        question: { $ref: '#/components/schemas/PulseDriverQuestion' }
        rotatingText:
          type: object
          nullable: true
          required: [en]
          properties:
            en: { type: string }
          additionalProperties: { type: string }
          description: >-
            The cycle's snapshotted question text as a language->value map ("en" always
            present) — set on the ROTATING row only.
        mean:
          type: number
          format: double
          nullable: true
          description: 1dp mean over valid (non-NA) answers; null when none exist.
        favorablePct:
          type: number
          format: double
          nullable: true
          description: Share of 4-5 answers among valid ones, 1dp.
        unfavorablePct:
          type: number
          format: double
          nullable: true
          description: Share of 1-2 answers among valid ones, 1dp.
        validCount:
          type: integer
          minimum: 0
          description: Non-NA answers — always displayed alongside the numbers.
        meanDelta:
          type: number
          format: double
          nullable: true
          description: >-
            Mean change vs the comparable previous cycle (1dp); null without one. Rotating
            rows compare only when the previous cycle asked the SAME question. Never framed
            as statistically significant.
        favorableDeltaPp:
          type: number
          format: double
          nullable: true
          description: Favorable-share change in percentage points (1dp); null without a comparable previous.

    PulsePreviousComparison:
      type: object
      required: [cycleId, enpsDelta]
      properties:
        cycleId: { type: integer, format: int32, minimum: 0 }
        enpsDelta:
          type: integer
          description: Whole-point eNPS change vs that cycle over the same scope.

    PulseTeamResults:
      type: object
      required: [cycleId, teamId, teamName, mode, participantCount, responseCount, responseRate, insufficientResponses]
      properties:
        cycleId: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        mode: { $ref: '#/components/schemas/PulseAggregationMode' }
        participantCount: { type: integer, minimum: 0 }
        responseCount: { type: integer, minimum: 0 }
        responseRate: { type: number, format: double }
        insufficientResponses:
          type: boolean
          description: >-
            True when the scope has fewer than 3 responses — every aggregate field below is
            null (k-anonymity), and the client shows a "not enough responses" state.
        enps:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PulseEnpsAggregate' }]
        drivers:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/PulseDriverResult' }
          description: One row per Q2-Q5 plus the rotating question.
        previous:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PulsePreviousComparison' }]
          description: >-
            Set only when an immediately preceding non-cancelled closed cycle exists AND its
            same-scope response count also passes the k-floor.

    PulseCommentsResponse:
      type: object
      required: [items, responseCount, insufficientResponses]
      properties:
        items:
          type: array
          items: { type: string }
          description: Author-free, shuffled per request; empty when withheld.
        responseCount: { type: integer, minimum: 0 }
        insufficientResponses: { type: boolean }

    PulseTrendAvailability:
      type: string
      enum: [OK, NOT_ENOUGH_RESPONSES, NOT_A_RESPONDENT]

    PulseTrendPoint:
      type: object
      required: [cycleId, closedAt, availability]
      properties:
        cycleId: { type: integer, format: int32, minimum: 0 }
        closedAt: { type: integer, format: int64 }
        availability: { $ref: '#/components/schemas/PulseTrendAvailability' }
        enps:
          type: integer
          nullable: true
          description: Null unless availability is OK.
        responseCount:
          type: integer
          nullable: true
          description: Null for NOT_A_RESPONDENT (a non-respondent learns nothing about that cycle).
        responseRate: { type: number, format: double, nullable: true }
        favorableQ2:
          type: number
          format: double
          nullable: true
          description: >-
            Favorable share (Agree/Strongly agree among valid answers, 1dp percent) of the
            fixed driver; null unless availability is OK — and null even then when every
            answer was "Not applicable". The rotating question has no trend field: it
            changes between cycles, so trending it is meaningless.
        favorableQ3: { type: number, format: double, nullable: true }
        favorableQ4: { type: number, format: double, nullable: true }
        favorableQ5: { type: number, format: double, nullable: true }

    PulseTrendResponse:
      type: object
      required: [teamId, teamName, mode, points]
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        mode: { $ref: '#/components/schemas/PulseAggregationMode' }
        points:
          type: array
          items: { $ref: '#/components/schemas/PulseTrendPoint' }
          description: Non-cancelled CLOSED cycles, oldest first.

    TeamRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }

    PulseVisibleTeams:
      type: object
      required: [resultsTeams, monitoredTeams, memberTeams]
      properties:
        resultsTeams:
          type: array
          items: { $ref: '#/components/schemas/TeamRef' }
          description: Teams the caller may open results for (own + managed + below; HR all).
        monitoredTeams:
          type: array
          items: { $ref: '#/components/schemas/TeamRef' }
          description: Teams the caller may monitor (managed + below; HR all; empty for non-managers).
        memberTeams:
          type: array
          items: { $ref: '#/components/schemas/TeamRef' }
          description: Teams the caller is a MEMBER of (the "Teams I belong to" results view; HR all).

    PulseSettings:
      type: object
      required: [cadenceWeeks, openDays]
      properties:
        cadenceWeeks:
          type: integer
          minimum: 1
          maximum: 52
          description: Suggested weeks between cycle opens (admin-form prefill only).
        openDays:
          type: integer
          minimum: 1
          maximum: 90
          description: Suggested days a cycle stays open (admin-form prefill only).

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying the specific occurrence.
