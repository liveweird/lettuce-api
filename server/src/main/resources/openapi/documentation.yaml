    DaysOffCreateRequest:
      type: object
      required: [type, startDate, endDate]
      properties:
        type:
          type: string
          enum: [PAID, UNPAID]
          description: PAID draws on one of the owner's paid pools; UNPAID is unlimited.
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The paid pool kind a PAID request draws on (v3.2.0); omitted/null = the default
            kind. 400 with UNPAID, for an unknown/archived kind, or for an extra kind the
            owner holds no active pool of (the default kind needs no grant — an ungranted
            default is a zero budget, i.e. 409 over budget).
        startDate:
          type: string
          format: date
          description: First day of the period, strict zero-padded ISO YYYY-MM-DD.
        endDate:
          type: string
          format: date
          description: >-
            Last day (inclusive), not before startDate and in the same calendar year — a
            New-Year-spanning wish is two requests.
        startHalf:
          type: boolean
          default: false
          description: The period's first day is a half day. A single-day request expresses its half day here.
        endHalf:
          type: boolean
          default: false
          description: The period's last day is a half day; must stay false on a single-day request (400).
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            Omitted/null: the caller requests for themselves (REQUESTED). Set: the caller — a
            manager in this user's transitive management chain (chain-wide since v2.33.0) —
            records the entry on their behalf, born
            ACCEPTED with the caller as resolver (v2.29.0). 403 for anyone else, including the
            target themselves.

    DaysOffCancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            The mandatory cancellation reasoning (v2.31.0) — stored encrypted at rest on the
            request; shown to whoever can see the cancelled row, never carried by
            notifications. Blank is 400.

    DaysOffResponse:
      type: object
      required:
        [id, userId, userName, type, poolTypeId, poolName, status, startDate, endDate, startHalf, endHalf, days,
         createdAt, resolvedById, resolvedByName, resolvedAt, cancelledAt, cancelledById, cancelledByName, cancelReason, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        type: { type: string, enum: [PAID, UNPAID] }
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The paid pool kind (v3.2.0); null for UNPAID.
        poolName:
          type: string
          nullable: true
          description: >-
            The paid pool kind's current name (v3.2.0); null for UNPAID. Archived kinds keep
            labelling their history. Both pool fields are REDACTED (null) when the reader is a
            teammate seeing the request by calendar parity (v3.2.1 — the absence is shared,
            the category of leave is not); owner, chain managers, and HR see them.
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED]
          description: >-
            REQUESTED → ACCEPTED | REJECTED (a chain manager resolves), plus terminal
            CANCELLED (the owner or a chain manager withdraws it, with a mandatory reason —
            v2.31.0). REQUESTED and ACCEPTED reserve paid budget; REJECTED and CANCELLED
            free it.
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startHalf: { type: boolean }
        endHalf: { type: boolean }
        days:
          type: number
          format: double
          description: >-
            The frozen working-day cost in days (0.5 steps) — weekends and public holidays
            inside the period cost nothing; computed against the holiday registry at creation
            and never repriced.
        createdAt: { type: integer, format: int64, description: "Epoch milliseconds, immutable." }
        resolvedById:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The accepting/rejecting manager — null while REQUESTED.
        resolvedByName: { type: string, nullable: true }
        resolvedAt: { type: integer, format: int64, nullable: true, description: Epoch milliseconds. }
        cancelledAt: { type: integer, format: int64, nullable: true, description: Epoch milliseconds. }
        cancelledById:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The cancelling actor (v2.31.0 — the owner or a chain manager). Null unless
            CANCELLED, and null on requests cancelled before the rework.
        cancelledByName: { type: string, nullable: true }
        cancelReason:
          type: string
          nullable: true
          description: >-
            The mandatory cancellation reasoning (decrypted; stored encrypted at rest). Null
            unless CANCELLED, and null on requests cancelled before the rework.
        lastModified: { type: integer, format: int64 }

    DaysOffListItem:
      type: object
      required:
        [id, userId, userName, userDeleted, type, poolTypeId, poolName, status, startDate, endDate, startHalf,
         endHalf, days, createdAt, cancelledAt, cancelledByName, cancelReason, canCancel,
         canResolve, lastModified]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        userDeleted: { type: boolean }
        type: { type: string, enum: [PAID, UNPAID] }
        poolTypeId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The paid pool kind (v3.2.0); null for UNPAID.
        poolName:
          type: string
          nullable: true
          description: The paid pool kind's current name (v3.2.0); null for UNPAID.
        status: { type: string, enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startHalf: { type: boolean }
        endHalf: { type: boolean }
        days: { type: number, format: double }
        createdAt: { type: integer, format: int64 }
        cancelledAt: { type: integer, format: int64, nullable: true, description: Epoch milliseconds. }
        cancelledByName:
          type: string
          nullable: true
          description: Null unless CANCELLED (and on requests cancelled before v2.31.0).
        cancelReason:
          type: string
          nullable: true
          description: >-
            The mandatory cancellation reasoning (decrypted; stored encrypted at rest) —
            backs the table's reason popover. Null unless CANCELLED (and on pre-rework
            cancellations).
        canCancel:
          type: boolean
          description: >-
            Server-computed capability (v2.31.0, the team-KPI canManage precedent): the
            caller may cancel this row — they own it or manage the owner transitively, and
            it is REQUESTED/ACCEPTED.
        canResolve:
          type: boolean
          description: >-
            Server-computed capability (v2.32.0): the caller may accept/reject this row —
            it is REQUESTED and they are a manager in the owner's transitive chain
            (chain-wide since v2.33.0). Marks actionable rows honestly across views.
        lastModified: { type: integer, format: int64 }

    DaysOffPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DaysOffCalendarEntry:
      type: object
      required: [requestId, date, type, poolName, status, half]
      properties:
        requestId: { type: integer, format: int32, minimum: 0 }
        date: { type: string, format: date }
        type: { type: string, enum: [PAID, UNPAID] }
        poolName:
          type: string
          nullable: true
          description: >-
            The paid pool kind's name (v3.2.0) — the cell tooltip; null for UNPAID, and null on
            OTHER people's entries in the member scope (v3.2.1 — teammates see the absence,
            not the category of leave; the caller's own bars and the managed scope keep it).
        status:
          type: string
          enum: [REQUESTED, ACCEPTED]
          description: Only counting statuses appear on the calendar; REQUESTED renders as tentative.
        half: { type: boolean, description: True on a half-day edge day of its period. }

    DaysOffCalendarUser:
      type: object
      required: [userId, userName, userDeleted, entries]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        userName: { type: string }
        userDeleted: { type: boolean }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DaysOffCalendarEntry'
          description: The user's marked days inside the month, date-ascending; may be empty.

    DaysOffCalendarResponse:
      type: object
