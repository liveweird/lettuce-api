apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  # Single-replica in-memory state (login lockout, MFA challenges, throttles — all
  # security.md-documented as per-instance) means two pods can never briefly overlap the
  # way a default RollingUpdate would; Recreate always tears the old pod down first (the
  # postgres-deployment.yaml precedent — same rationale, different state).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: app
    spec:
      # No in-cluster API calls are ever made from this pod — the default token would only
      # be an unused credential sitting in the filesystem.
      automountServiceAccountToken: false
      # No shutdownGracePeriod/shutdownTimeout is set in application.yaml, so EngineMain's
      # Netty-engine defaults apply (a ~2s quiet period + 5s timeout for in-flight requests
      # to drain, per Ktor's documented server-stop behavior — see
      # https://ktor.io/docs/server-stop.html). 30s (the Kubernetes default, stated
      # explicitly here) leaves generous headroom above that worst case before SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - env:
            # Secrets come from the `lettuce-secrets` Secret — see k8s/templates/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: JWT_SECRET
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: DATA_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/lettuce
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/lettuce
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # The app sits behind the TLS-terminating Ingress in k8s/app-ingress.yaml, which sets
            # X-Forwarded-For (replaced with the real client IP) + X-Forwarded-Proto/-Host, so
            # rate limiting keys on the real client and the HTTPS redirect sees the real scheme
            # and name. HTTP_PROXY_HOPS = trusted proxies that APPEND to X-Forwarded-For (1 =
            # the ingress alone; see application.yaml `http.proxyHops`).
            - name: HTTP_BEHIND_PROXY
              value: "true"
            - name: HTTP_PROXY_HOPS
              value: "1"
            # The read-only GraphQL integration API at /integration/graphql (v3.0.0) is
            # fail-closed by default (integration.enabled=false → no routes registered).
            # It stays OFF in this manifest on purpose: enabling an authorization-bypassing
            # read surface is a per-deployment decision, not a shipped default. To turn it on
            # for a specific deployment, add `INTEGRATION_ENABLED: "true"` here (the ADMIN key
            # registry works regardless; per-key limit INTEGRATION_RATE_LIMIT_PER_MINUTE, 120).
            # Outbound email for the self-service password reset. Ships disabled — set
            # "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable (production
            # refuses the `log` transport). SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "lettuce@localhost"
            # The public URL the emails link to — keep in step with the Ingress host
            # (k8s/templates/app-ingress.yaml) and the certificate SAN. Sourced from the
            # out-of-band `lettuce-config` ConfigMap (key MAIL_APP_URL) so no per-deployment
            # hostname is baked into this file. The template is rendered and applied separately
            # from `kubectl apply -f k8s/`. optional: true → a missing key
            # leaves it blank, which the server tolerates with a startup WARN (link-less emails),
            # never a crash. Create it beside lettuce-secrets, e.g.:
            #   kubectl create configmap lettuce-config --from-literal=MAIL_APP_URL=https://$HOST
            - name: MAIL_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: lettuce-config
                  key: MAIL_APP_URL
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Release deployments must render this template with scripts/render-app-deployment.sh.
          # The renderer accepts only an explicit registry/repository@sha256 digest and replaces
          # this fail-closed sentinel. Never apply this template directly.
          image: LETTUCE_APP_IMAGE_REQUIRED
          imagePullPolicy: IfNotPresent
          name: lettuce-app
          ports:
            - containerPort: 8080
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1): ~270 MiB RSS
          # under light load. Request covers steady state; the 512 MiB limit bounds it with headroom.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          # Pod hardening (Checkup #34 Tier A): the image already runs as the non-root `lettuce`
          # user (see Dockerfile), so runAsNonRoot only enforces what's already true; the
          # container never needs Linux capabilities, privilege escalation, or a writable root
          # filesystem — the app logs to stdout only (logback.xml has no file appender) and
          # Flyway/R2DBC never write to disk. /tmp is the one path the JVM itself expects to be
          # writable (java.io.tmpdir), backed by the emptyDir volume below.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Dedicated health endpoints (plugins/Health.kt), both unauthenticated and outside /api/:
          #   /healthz — liveness: process-alive only, never touches the DB (so a DB outage does
          #              NOT restart-storm the pod).
          #   /readyz  — readiness: a trivial DB round-trip; 503 while the DB is unreachable, so the
          #              pod is pulled from the Service until it can actually serve API traffic.
          # The startupProbe gives JVM boot + Flyway migrations up to ~150s (30 × 5s) before the
          # liveness clock starts, so a slow first boot cannot trigger a restart.
          # Every probe sends X-Forwarded-Proto: https — the header the TLS-terminating ingress sets
          # (HTTP_BEHIND_PROXY above makes the app trust it). Without it, production mode answers the
          # plain-HTTP probe with a 301 to https://<pod-ip>/, which the kubelet FOLLOWS (same host)
          # into a refused :443 — probes never pass and the pod crash-loops (the v3.6.1 incident).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir: {}
