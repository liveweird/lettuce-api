apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: app
  name: app
spec:
  # ClusterIP: the Ingress (k8s/templates/app-ingress.yaml) fronts the app; for debugging use
  # `kubectl port-forward svc/app 8081:8080`. Switching a live LoadBalancer Service to
  # ClusterIP can be rejected (allocated nodePort) — `kubectl delete svc app` first, then apply.
  type: ClusterIP
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: app
